services:
  app:
    build: ./web
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: otoshimono
      PGUSER: otoshimono
      PGPASSWORD: otoshimono_dev
      STAFF_PASSCODE: otoshimono-dev-passcode
      SESSION_SECRET: local-dev-session-secret-change-me
      # メールの送信先（開発用のテスト値。Mailpit が受け取るだけで、外には送らない）
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: "技大祭 落とし物窓口（TEST） <test@example.com>"
      MAIL_SUBJECT_PREFIX: "[TEST]"
      APP_ORIGIN: http://127.0.0.1:3000

  # 開発用のメール確認サーバー。届いたメールは http://127.0.0.1:8025 で見られる
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  db:
    image: postgres:17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: otoshimono
      POSTGRES_USER: otoshimono
      POSTGRES_PASSWORD: otoshimono_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "otoshimono", "-d", "otoshimono"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:

services:
  app:
    build: ./web
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: otoshimono
      PGUSER: otoshimono
      PGPASSWORD: otoshimono_dev
      STAFF_PASSCODE: otoshimono-dev-passcode
      SESSION_SECRET: local-dev-session-secret-change-me
    volumes:
      - photos_data:/app/data/photos

  db:
    image: postgres:17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: otoshimono
      POSTGRES_USER: otoshimono
      POSTGRES_PASSWORD: otoshimono_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "otoshimono", "-d", "otoshimono"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
  photos_data:
